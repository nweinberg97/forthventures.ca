<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forth Ventures</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Forth Ventures is a consumer venture studio in Vancouver, building useful products with creators.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=EB+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
/* Forth Ventures, coming soon. Black, quiet, cinematic: Vancouver footage behind, a few words in front.
   Brand from the decks: ink, cream, mist; Montserrat 800 with tracked caps; EB Garamond italic motto. */
:root{color-scheme:dark;--ink:#0D0D0F;--cream:#EDEAE3;--mist:#BECBDD;--grey:#9A9893;--soft:#C9C7C2}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--cream);font:17px/1.6 "Montserrat",Arial,sans-serif;overflow-x:clip}
.stage{position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
/* footage: drop clips into video/ and they crossfade; until then a slow night-sky fallback plays */
.footage{position:absolute;inset:0;z-index:0;background:#060608}
.footage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease}
.footage video.on{opacity:1}
.fallback{position:absolute;inset:-10%;background:
 radial-gradient(40% 30% at 20% 75%,rgba(190,203,221,.10),transparent 70%),
 radial-gradient(45% 35% at 80% 85%,rgba(45,67,101,.35),transparent 70%),
 radial-gradient(60% 40% at 50% 110%,rgba(190,203,221,.12),transparent 70%);animation:breathe 18s ease-in-out infinite alternate}
@keyframes breathe{from{transform:translate3d(-2%,0,0) scale(1)}to{transform:translate3d(2%,-2%,0) scale(1.08)}}
.shade{position:absolute;inset:0;z-index:1;background:radial-gradient(120% 70% at 50% 0%,rgba(28,40,66,.55),transparent 70%),radial-gradient(90% 50% at 50% 110%,rgba(45,67,101,.35),transparent 70%),linear-gradient(180deg,rgba(8,10,18,.35) 0%,rgba(13,13,15,.2) 50%,rgba(13,13,15,.75) 100%)}
.top,.main,.mission,.bottom{position:relative;z-index:2}
.sky{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}
.mission{text-align:center;margin-top:clamp(40px,7vh,72px)}
.core{margin:0;font-weight:700;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.01em;color:var(--cream);opacity:0;animation:in 1.4s 1.8s ease forwards}
.mission .dream{color:var(--mist);font-style:italic;font-family:"EB Garamond",Georgia,serif;font-size:clamp(17px,1.5vw,20px);margin-top:8px;max-width:60ch}
.mission .sub .hint{margin-top:6px;color:var(--mist);font-family:"EB Garamond",Georgia,serif;font-style:italic;font-size:1.15em}.mission .sub{margin:14px auto 0;max-width:40ch;line-height:1.65;text-wrap:balance;color:var(--grey);font-size:clamp(14px,1.2vw,16px);opacity:0;animation:in 1.4s 2.1s ease forwards}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(5vw,22px);width:100%}
.top .wrap{display:flex;justify-content:space-between;align-items:center;min-height:88px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.2em;font-size:15px;text-transform:uppercase}
.logo svg{height:26px;width:auto}
.soon{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--mist)}
.main{flex:1;display:flex;align-items:flex-start;text-align:center}
.main .wrap{display:flex;flex-direction:column;align-items:center;padding-block:clamp(48px,12vh,130px) 48px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--mist);margin:0;opacity:0;animation:in 1.2s .2s ease forwards}
h1{margin:0;font-weight:800;letter-spacing:.16em;text-transform:uppercase;line-height:1.1;font-size:clamp(30px,5.4vw,76px);max-width:none;padding-left:.16em;text-wrap:balance;opacity:0;animation:in 1.4s .3s ease forwards}
.motto{font-family:"EB Garamond",Georgia,serif;font-style:italic;color:var(--mist);font-size:clamp(18px,1.6vw,22px);margin:26px 0 0;opacity:0;animation:in 1.4s 1.6s ease forwards}
.lede{font-family:"EB Garamond",Georgia,serif;font-style:italic;font-size:clamp(19px,1.65vw,24px);line-height:1.45;color:var(--soft);max-width:38ch;text-wrap:balance;margin:22px 0 0;opacity:0;animation:in 1.4s .65s ease forwards}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
form{display:flex;width:100%;max-width:500px;margin-top:36px;border:1.5px solid rgba(237,234,227,.35);background:rgba(13,13,15,.45);backdrop-filter:blur(8px);opacity:0;animation:in 1.4s 1.4s ease forwards}
input{flex:1;min-width:0;min-height:clamp(44px,4.2vw,54px);border:0;background:transparent;color:var(--cream);font:16px "Montserrat",sans-serif;padding:0 clamp(12px,1.4vw,18px)}
input::placeholder{color:var(--grey)}
button{min-height:clamp(44px,4.2vw,54px);border:0;background:var(--cream);color:var(--ink);font:700 clamp(10.5px,.95vw,12.5px) "Montserrat",sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:0 clamp(12px,1.6vw,22px);cursor:pointer;white-space:nowrap}
button:hover{background:#fff}
:focus-visible{outline:2px solid var(--mist);outline-offset:3px}
.fine{font-size:12.5px;color:var(--grey);margin:12px 0 0;opacity:0;animation:in 1.4s 1.5s ease forwards}
.msg{font-size:14px;color:var(--mist);min-height:22px;margin:6px 0 0}
.bottom .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:0 28px;font-size:12.5px;color:var(--grey);letter-spacing:.04em}
.bottom a{color:inherit;text-decoration:none}.bottom a:hover{color:var(--cream)}
.vh{position:absolute;left:-9999px}

@media(prefers-reduced-motion:reduce){.fallback{animation:none}.eyebrow,h1,.motto,.lede,form,.fine,.core,.mission .sub{animation:none;opacity:1}}
@media(min-width:1100px){.lede,.mission .sub{max-width:none;white-space:nowrap}}
@media(max-width:520px){.lede{font-size:17px;max-width:none;margin-top:16px}.mission{margin-top:44px}.mission .sub{font-size:14px;max-width:none;margin-top:10px}.core{font-size:20px;text-wrap:balance}h1{letter-spacing:.12em;padding-left:.12em}form{margin-top:26px;max-width:340px}.main .wrap{padding-block:36px 32px}.bottom .wrap{flex-direction:column;align-items:center;gap:4px;font-size:11.5px;padding-bottom:22px}.top .wrap{min-height:68px}}
@media(max-width:360px){input{font-size:15px}button{letter-spacing:.08em;padding:0 10px}}

/* readability pass: one headline, one motto, one sentence, one action, one quiet note */
:root{--grey:#A9A6A0;--soft:#DAD7D0}
.shade{background:radial-gradient(55% 45% at 50% 42%,rgba(13,13,15,.55),transparent 75%),radial-gradient(120% 70% at 50% 0%,rgba(28,40,66,.5),transparent 70%),radial-gradient(90% 50% at 50% 110%,rgba(45,67,101,.35),transparent 70%),linear-gradient(180deg,rgba(8,10,18,.35) 0%,rgba(13,13,15,.2) 50%,rgba(13,13,15,.75) 100%)}
.main{align-items:center}
.main .wrap{padding-block:clamp(32px,8vh,96px) clamp(40px,8vh,96px)}
h1{font-size:clamp(34px,5.6vw,80px);letter-spacing:.14em;padding-left:.14em}
.motto{font-size:clamp(22px,2.1vw,30px);line-height:1.25;color:var(--mist);margin:22px 0 0;animation-delay:.6s}
.lede{font-family:"Montserrat",Arial,sans-serif;font-style:normal;font-weight:400;font-size:clamp(16.5px,1.35vw,19px);line-height:1.65;color:var(--soft);max-width:36ch;margin:18px 0 0;text-wrap:balance;white-space:normal;animation-delay:.9s}
form{margin-top:40px;max-width:480px;border-color:rgba(237,234,227,.5);animation-delay:1.2s}
input{font-size:16px;color:var(--cream)}
input::placeholder{color:#8E8B85}
button{font-size:clamp(11.5px,.95vw,12.5px);letter-spacing:.14em}
.msg{min-height:20px}
.roadmap{display:flex;flex-direction:column;align-items:center;gap:18px;margin:clamp(28px,5vh,56px) 0 0;max-width:34ch;text-wrap:balance;font-size:clamp(14px,1.1vw,15.5px);line-height:1.6;letter-spacing:.01em;color:var(--grey);opacity:0;animation:in 1.4s 1.5s ease forwards}
.roadmap .rule{display:block;width:40px;height:1px;background:rgba(190,203,221,.45)}
.bottom .wrap{color:#8E8B85}
@media(min-width:1100px){.lede{max-width:40ch;white-space:normal}}
@media(max-width:520px){h1{font-size:30px;letter-spacing:.11em;padding-left:.11em}.motto{font-size:21px;margin-top:16px}.lede{font-size:16px;margin-top:12px;max-width:30ch}form{margin-top:28px}.roadmap{margin-top:32px;font-size:14px;max-width:28ch}}
@media(prefers-reduced-motion:reduce){.roadmap{animation:none;opacity:1}}

/* calm pass: quiet confidence. One axis, generous space, fewer sizes, slower motion. */
.main .wrap{padding-block:clamp(40px,10vh,120px) clamp(48px,10vh,120px)}
h1{font-size:clamp(30px,4.6vw,64px);letter-spacing:.24em;padding-left:.24em;font-weight:700;line-height:1.1}
.motto{font-size:clamp(20px,1.8vw,26px);margin-top:28px;color:var(--mist);letter-spacing:.005em}
.lede{font-size:clamp(15.5px,1.15vw,17px);line-height:1.75;color:#B9B6AF;max-width:38ch;margin-top:14px}
form{margin-top:48px;max-width:440px;border:1px solid rgba(237,234,227,.28);background:rgba(13,13,15,.35)}
form:focus-within{border-color:rgba(190,203,221,.6)}
input,button{min-height:50px}
input{font-size:15px;padding:0 18px}
input:focus{outline:none}
button{font-size:11.5px;letter-spacing:.18em;padding:0 22px}
.roadmap{margin-top:clamp(56px,9vh,96px);max-width:40ch;font-size:13.5px;letter-spacing:.02em;color:#8E8B85;gap:0}
.roadmap .rule{display:none}
.msg{min-height:18px;font-size:13px}
@media(max-width:520px){h1{font-size:26px;letter-spacing:.18em;padding-left:.18em}.motto{font-size:20px;margin-top:20px}.lede{font-size:15px;max-width:30ch}form{margin-top:36px}.roadmap{margin-top:56px;font-size:13px;max-width:30ch}}

/* premium pass: slow light, depth, texture, and a composed reveal */
.horizon{position:absolute;left:-20%;right:-20%;bottom:-38vh;height:70vh;z-index:1;pointer-events:none;
 background:radial-gradient(50% 50% at 50% 50%,rgba(190,203,221,.16),rgba(120,145,190,.07) 45%,transparent 70%);
 filter:blur(10px);animation:dawn 6s .3s cubic-bezier(.2,.6,.2,1) both,tide 14s 6.3s ease-in-out infinite alternate}
@keyframes dawn{from{opacity:0;transform:translate3d(0,22vh,0) scaleX(.8)}to{opacity:.85;transform:none}}
.horizon::after{content:"";position:absolute;inset:20% 25%;background:radial-gradient(50% 50% at 50% 55%,rgba(232,201,160,.07),transparent 70%)}
@keyframes tide{from{transform:translate3d(-3%,0,0) scaleX(1);opacity:.75}to{transform:translate3d(3%,-3%,0) scaleX(1.08);opacity:1}}
.spot{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(420px 320px at var(--mx,50%) var(--my,45%),rgba(190,203,221,.07),transparent 70%);transition:background .2s}
.grain{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.sky{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
h1{animation:track 2.2s .2s cubic-bezier(.2,.7,.1,1) both}
@keyframes track{from{opacity:0;letter-spacing:.6em;filter:blur(8px)}to{opacity:1;letter-spacing:.24em;filter:blur(0)}}
.motto,.lede,form,.roadmap{animation-name:rise;animation-duration:1.6s;animation-timing-function:cubic-bezier(.2,.7,.1,1);animation-fill-mode:both}
.motto{animation-delay:1s}.lede{animation-delay:1.25s}form{animation-delay:1.5s}.roadmap{animation-delay:1.9s}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
.motto{margin-top:26px}
.lede{margin-top:12px}
form{margin-top:52px;transition:border-color .4s,box-shadow .4s}
form:focus-within{border-color:rgba(190,203,221,.65);box-shadow:0 0 0 6px rgba(190,203,221,.06),0 20px 60px -20px rgba(120,145,190,.35)}
button{position:relative;overflow:hidden;transition:background .3s}
button::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);transition:left .7s ease}
button:hover::after{left:120%}
.roadmap{margin-top:56px;gap:16px}
.roadmap .rule{display:block;width:28px;height:1px;background:rgba(190,203,221,.4);animation:grow 1.2s 2.3s ease both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.bottom .wrap{letter-spacing:.08em}
@media(prefers-reduced-motion:reduce){.horizon{opacity:.85}.horizon,h1,.motto,.lede,form,.roadmap,.roadmap .rule{animation:none;opacity:1;filter:none}}
@media(max-width:520px){form{margin-top:36px}.roadmap{margin-top:44px}.spot{display:none}}
</style>
</head>
<body>
<div class="stage">
 <div class="footage" id="footage" aria-hidden="true"><div class="fallback"></div></div>
 <canvas class="sky" id="sky" aria-hidden="true"></canvas>
 <div class="shade" aria-hidden="true"></div>
 <div class="horizon" aria-hidden="true"></div>
 <div class="spot" id="spot" aria-hidden="true"></div>
 <div class="grain" aria-hidden="true"></div>
 <header class="top"><div class="wrap">
  <span class="logo"><svg viewBox="30 20 590 700" aria-hidden="true"><path d="M125 205 L605 30 L578 158 L550 182 L250 293 L236 396 L540 284 L322 494 L205 546 L165 632 L42 712 Z" fill="#EDEAE3"/></svg>Forth</span>
 </div></header>
 <main class="main"><div class="wrap">
  <h1>Forth Ventures</h1>
  <p class="motto">Building a more human future.</p>
  <p class="lede">A venture studio building products that help people live better, with the creators they trust.</p>
  <form id="f" novalidate>
   <label for="e" class="vh">Email</label>
   <input id="e" type="email" placeholder="Your email" autocomplete="email" required>
   <button type="submit">Notify me at launch</button>
  </form>
  <p class="msg" id="m" role="status"></p>
  <p class="roadmap"><span class="rule" aria-hidden="true"></span>Starting with everyday products, building toward infrastructure for human potential.</p>
 </div></main>
 <footer class="bottom"><div class="wrap"><span>Made in Vancouver</span><span>© 2026 Forth Ventures™</span></div></footer>
</div>
<script>
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();document.getElementById('m').textContent="Preview only: this form isn't connected yet.";});
/* Vancouver footage: add files with these names to video/ and they play in turn, crossfading. */
(function(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 var clips=['video/vancouver-1.mp4','video/vancouver-2.mp4','video/vancouver-3.mp4','video/vancouver-4.mp4'];
 var box=document.getElementById('footage'),vids=[],i=0;
 clips.forEach(function(src){var v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=src;
  v.addEventListener('loadeddata',function(){vids.push(v);if(vids.length===1){v.classList.add('on');v.play();}});
  v.addEventListener('error',function(){v.remove()});box.appendChild(v)});
 setInterval(function(){if(vids.length<2)return;var a=vids[i%vids.length];i++;var b=vids[i%vids.length];b.currentTime=0;b.play();b.classList.add('on');a.classList.remove('on');setTimeout(function(){a.pause()},1700)},7000);
 document.addEventListener('visibilitychange',function(){vids.forEach(function(v){if(document.hidden)v.pause();else if(v.classList.contains('on'))v.play()})});
})();
/* a quiet night sky: faint twinkling stars, and now and then a shooting star */
(function(){
 var c=document.getElementById('sky'),x=c.getContext('2d'),W,H,dpr=Math.min(2,window.devicePixelRatio||1),stars=[],shots=[],still=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function size(){W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);stars=[];var n=Math.round(W*H/3200);for(var i=0;i<n;i++){var big=Math.random()<.08;stars.push({x:Math.random()*W,y:Math.random()*H*.92,r:big?Math.random()*.9+1.1:Math.random()*.9+.25,a:big?Math.random()*.3+.6:Math.random()*.45+.2,p:Math.random()*6.28,s:Math.random()*1.2+.3})}}
 size();addEventListener('resize',size);
 function shoot(){var fromLeft=Math.random()<.5,sx=fromLeft?Math.random()*W*.5:W*.5+Math.random()*W*.5,sy=Math.random()*H*.35,ang=(fromLeft?1:-1)*(Math.PI/180)*(18+Math.random()*14),sp=10+Math.random()*6;
  shots.push({x:sx,y:sy,vx:(fromLeft?1:-1)*Math.cos(Math.abs(ang))*sp,vy:Math.abs(Math.sin(ang))*sp,life:0,max:60+Math.random()*35,len:170+Math.random()*130})}
 function loop(t){x.clearRect(0,0,W,H);
  for(var i=0;i<stars.length;i++){var s=stars[i],tw=still?1:(.6+.4*Math.sin(t/1000*s.s+s.p));x.globalAlpha=s.a*tw;x.fillStyle='#EDEAE3';x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill()}
  var P=window.__fx;if(P&&P.k>0){var near=[];for(var q=0;q<stars.length;q++){var st=stars[q],dx=st.x-P.x,dy=st.y-P.y,d=dx*dx+dy*dy;if(d<170*170)near.push(st)}
   x.lineWidth=.6;for(var u=0;u<near.length;u++)for(var v=u+1;v<near.length;v++){var A=near[u],Bq=near[v],ex=A.x-Bq.x,ey=A.y-Bq.y,dd=Math.sqrt(ex*ex+ey*ey);if(dd<95){
    var pd=Math.hypot((A.x+Bq.x)/2-P.x,(A.y+Bq.y)/2-P.y);x.globalAlpha=Math.max(0,(1-dd/95)*(1-pd/170))*.75*P.k;x.strokeStyle='#BECBDD';x.beginPath();x.moveTo(A.x,A.y);x.lineTo(Bq.x,Bq.y);x.stroke()}}
   x.globalAlpha=1}
  for(var j=shots.length-1;j>=0;j--){var m=shots[j];m.life++;m.x+=m.vx;m.y+=m.vy;var f=m.life/m.max,al=f<.15?f/.15:1-(f-.15)/.85,sp=Math.hypot(m.vx,m.vy),tx=m.x-m.vx/sp*m.len,ty=m.y-m.vy/sp*m.len;
   var g=x.createLinearGradient(m.x,m.y,tx,ty);g.addColorStop(0,'rgba(237,234,227,'+(.95*al)+')');g.addColorStop(.25,'rgba(190,203,221,'+(.45*al)+')');g.addColorStop(1,'rgba(190,203,221,0)');
   x.globalAlpha=1;x.strokeStyle=g;x.lineWidth=1.9;x.lineCap='round';x.beginPath();x.moveTo(m.x,m.y);x.lineTo(tx,ty);x.stroke();
   x.fillStyle='rgba(255,255,255,'+al+')';x.beginPath();x.arc(m.x,m.y,1.8,0,6.283);x.fill();
   if(m.life>=m.max)shots.splice(j,1)}
  x.globalAlpha=1;if(!still)requestAnimationFrame(loop)}
 requestAnimationFrame(loop);
 if(!still){setTimeout(shoot,2500);(function next(){setTimeout(function(){if(!document.hidden)shoot();next()},6000+Math.random()*6000)})()}
})();

/* constellations: stars near the cursor gently connect, like people finding each other */
(function(){if(matchMedia('(hover: none)').matches)return;var P=window.__fx={x:-999,y:-999,on:false,k:0},t=0;
 addEventListener('pointermove',function(e){P.x=e.clientX;P.y=e.clientY;P.on=true;clearTimeout(t);t=setTimeout(function(){P.on=false},2200)});
 (function ease(){P.k+=((P.on?1:0)-P.k)*.06;if(P.k<.01&&!P.on)P.k=0;requestAnimationFrame(ease)})();
 document.addEventListener('pointerleave',function(){P.on=false});
})();
/* depth: the sky drifts a few pixels against the cursor, and a soft light follows it */
(function(){if(matchMedia('(prefers-reduced-motion: reduce)').matches||matchMedia('(hover: none)').matches)return;
 var sky=document.getElementById('sky'),spot=document.getElementById('spot'),raf=0,mx=.5,my=.45;
 addEventListener('pointermove',function(e){mx=e.clientX/innerWidth;my=e.clientY/innerHeight;if(!raf)raf=requestAnimationFrame(function(){raf=0;
  sky.style.transform='translate3d('+((mx-.5)*-14).toFixed(1)+'px,'+((my-.5)*-10).toFixed(1)+'px,0)';
  spot.style.setProperty('--mx',(mx*100).toFixed(1)+'%');spot.style.setProperty('--my',(my*100).toFixed(1)+'%')})});
})();
</script>
</body>
</html>
